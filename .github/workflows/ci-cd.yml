
name: BiblioConnect - CI/CD

on:
  push:
    branches:
      - feature/ci-cd
  pull_request:
    branches:
      - feature/ci-cd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-tests:
    name: Symfony - Composer et PHPUnit
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      APP_SECRET: ci_test_secret_not_for_production
      DATABASE_URL: "postgresql://biblio:biblio_test@127.0.0.1:5432/biblioconnect?serverVersion=16&charset=utf8"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biblio
          POSTGRES_PASSWORD: biblio_test
          POSTGRES_DB: biblioconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblio -d biblioconnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, mbstring, intl, pdo_pgsql, pgsql, xml, dom, zip
          coverage: none
          tools: composer:v2

      - name: Verifier composer.json
        run: composer validate --no-check-publish

      - name: Installer les dependances
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Verifier Symfony
        run: php bin/console about

      - name: Creer la base PostgreSQL de test
        run: php bin/console doctrine:database:create --if-not-exists --env=test

      - name: Executer les migrations PostgreSQL
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Executer PHPUnit
        run: php vendor/bin/phpunit -c phpunit.xml.dist
  sonar-analysis:
    name: Analyse SonarQube - Symfony
    needs: php-tests
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Analyser BiblioConnect
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $scanner = "C:\tools\sonar-scanner-7.2.0.5079-windows-x64\bin\sonar-scanner.bat"

          if (-not (Test-Path $scanner)) {
              throw "SonarScanner introuvable"
          }

          & $scanner "-Dsonar.host.url=http://127.0.0.1:9000"

          if ($LASTEXITCODE -ne 0) {
              throw "Echec de l'analyse SonarQube"
          }
  
  docker-ghcr:
    name: Docker - Trivy - GitHub Registry
    needs: sonar-analysis
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Definir le nom de l'image
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Construire l'image Docker
        run: |
          docker build --pull \
            -t "${{ steps.image.outputs.name }}:${{ github.sha }}" \
            .

      - name: Scanner avec Trivy
        run: |
          IMAGE="${{ steps.image.outputs.name }}:${{ github.sha }}"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache-biblio:/root/.cache/ \
            aquasec/trivy:0.68.2 image \
            --image-src docker \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE"

      - name: Connexion au registre GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image dans GHCR
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          docker push "$IMAGE:${{ github.sha }}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"
  update-gitops:
    name: CD - Mise à jour GitOps
    needs: docker-ghcr
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: feature/ci-cd

      - name: Mettre à jour l'image Kubernetes
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          sed -i -E \
            "s#ghcr\.io/anilzer/biblioconnect-devops(@sha256:[a-f0-9]+|:[a-zA-Z0-9._-]+)#${IMAGE}:${SHA}#g" \
            k8s/app.yaml

          echo "Images mises à jour :"
          grep 'image: ghcr.io/' k8s/app.yaml

      - name: Commit automatique GitOps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/app.yaml

          if git diff --cached --quiet; then
            echo "Aucune modification GitOps."
            exit 0
          fi

          git commit -m "gitops: deploy image ${{ github.sha }} [skip ci]"
          git push origin HEAD:feature/ci-cd
  
  deploy-vps:
    name: CD - Production OVHcloud
    needs:
      - docker-ghcr
      - update-gitops

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/ci-cd'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production
      url: https://biblio.andilabayomi.fr/login

    permissions:
      contents: read

    concurrency:
      group: biblioconnect-vps-production
      cancel-in-progress: false

    steps:
      - name: Vérifier la version à déployer
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$IMAGE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "SHA invalide"
            exit 1
          fi

          echo "Version validée par la CI : $IMAGE_SHA"

      - name: Configurer la connexion SSH sécurisée
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$VPS_SSH_KEY" \
            > "$HOME/.ssh/biblioconnect_deploy"

          printf '%s\n' "$VPS_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/biblioconnect_deploy"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Déployer BiblioConnect sur OVHcloud
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i "$HOME/.ssh/biblioconnect_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "deploy $IMAGE_SHA"

      - name: Vérifier le site de production
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --max-time 15 \
            https://biblio.andilabayomi.fr/login \
            -o /dev/null

          echo "BiblioConnect est accessible en production."

