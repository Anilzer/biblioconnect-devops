
name: BiblioConnect - CI/CD

on:
  push:
    branches:
      - feature/ci-cd
  pull_request:
    branches:
      - feature/ci-cd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-tests:
    name: Symfony - Composer et PHPUnit
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      APP_SECRET: ci_test_secret_not_for_production
      DATABASE_URL: "postgresql://biblio:biblio_test@127.0.0.1:5432/biblioconnect_test?serverVersion=16&charset=utf8"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biblio
          POSTGRES_PASSWORD: biblio_test
          POSTGRES_DB: biblioconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblio -d biblioconnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, mbstring, intl, pdo_pgsql, pgsql, xml, dom, zip
          coverage: none
          tools: composer:v2

      - name: Verifier composer.json
        run: composer validate --no-check-publish

      - name: Installer les dependances
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Verifier Symfony
        run: php bin/console about

      - name: Executer les migrations PostgreSQL
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Executer PHPUnit
        run: php vendor/bin/phpunit -c phpunit.xml.dist
